<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="keywords" content="پاساژ, فروشگاه, مرکز خرید, پاساژگردی, موبایل, لوازم خانگی, ایران" />
  <meta name="theme-color" content="#ff6b00" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://example.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="fa_IR" />

  <meta property="og:description" content="جستجوی پاساژ و فروشگاه در سراسر ایران" />
  <meta property="og:url" content="https://example.com/" />
  <meta property="og:site_name" content="پاساژگردی" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="پاساژگردی" />
  <meta name="twitter:description" content="راهنمای پاساژ و فروشگاه‌های ایران" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="stylesheet" href="glass.css" />
  <link rel="stylesheet" href="main.css" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://example.com/#website",
        "name": "پاساژگردی",
        "url": "https://example.com/",
        "description": "راهنمای پاساژها و فروشگاه‌های ایران",
        "inLanguage": "fa-IR",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://example.com/?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      },
      {
        "@type": "Organization",
        "@id": "https://example.com/#organization",
        "name": "پاساژگردی",
        "url": "https://example.com/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://example.com/favicon.svg"
        }
      },
      {
        "@type": "WebPage",
        "@id": "https://example.com/#webpage",
        "url": "https://example.com/",
        "name": "پاساژگردی | راهنمای پاساژ و فروشگاه‌های ایران",
        "isPartOf": { "@id": "https://example.com/#website" },
        "about": { "@id": "https://example.com/#organization" },
        "description": "جستجوی پاساژ، فروشگاه، برند و دسته‌بندی در استان‌های ایران",
        "inLanguage": "fa-IR"
      }
    ]
  }
  </script>
</head>
<body>
  <div class="sticky-top" id="site-chrome">
    <div id="header-placeholder"></div>
    <!-- سرچ چسبان زیر هدر — بعد از باز شدن لیست همیشه دیده می‌شود -->
    <div class="sticky-search-wrap" id="sticky-search-wrap" hidden>
      <div class="landing-search glass sticky-search-box">
        <svg class="landing-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" id="search-input-sticky" placeholder="جستجوی شهر، پاساژ، برند، دسته، تلفن..." autocomplete="off" enterkeyhint="search" aria-label="جستجو" />
      </div>
    </div>
  </div>

  <section class="landing" id="landing">
    <div class="landing-inner">
      <div class="landing-logo" aria-hidden="true">
        <img src="favicon.svg" width="72" height="72" alt="" class="landing-logo-img" />
        <h1 class="landing-title">پاساژگردی</h1>
        <p class="landing-sub">راهنمای پاساژ و فروشگاه‌های ایران</p>
      </div>

      <div class="landing-search glass" id="landing-search-box">
        <svg class="landing-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" id="search-input" placeholder="جستجوی شهر، پاساژ، برند، دسته، تلفن..." autocomplete="off" enterkeyhint="search" aria-label="جستجو" />
      </div>

      <button type="button" id="expand-arrow" class="expand-arrow" aria-label="نمایش استان‌ها" title="باز / بسته کردن استان‌ها" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
    </div>
  </section>

  <main class="main-content is-collapsed" id="provinces">
    <h2 class="section-title">استان‌های ایران</h2>
    <div class="accordion" id="provinces-accordion"></div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="data.js" defer></script>
  <script>
    async function loadComponent(url, id) {
      try {
        var res = await fetch(url);
        if (!res.ok) throw new Error('fail');
        document.getElementById(id).innerHTML = await res.text();
      } catch (e) {
        if (id === 'header-placeholder') {
          document.getElementById(id).innerHTML =
            '<header class="site-header glass-bar">' +
            '<div class="header-right"><button class="icon-btn" id="menu-btn" aria-label="منو"><svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button></div>' +
            '<div class="header-center"><div class="logo-text">پاساژگردی</div></div>' +
            '<div class="header-left"><button class="icon-btn" id="theme-toggle" aria-label="تم"><svg id="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg id="icon-sun" class="hidden" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button></div></header>' +
            '<div class="nav-overlay" id="nav-overlay"></div>' +
            '<nav class="nav-drawer glass-strong" id="nav-drawer"><button class="icon-btn close-btn" id="close-nav" aria-label="بستن"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>' +
            '<ul class="nav-links"><li><a href="#">خانه</a></li><li><a href="#provinces">استان‌ها</a></li><li><a href="admin.html">پنل ادمین</a></li></ul></nav>';
        } else {
          document.getElementById(id).innerHTML =
            '<footer class="site-footer"><div class="footer-inner glass-bar-footer">' +
            '<div class="ad-banner">تبلیغات شما اینجاست · برای رزرو تماس بگیرید</div>' +
            '<div class="footer-socials"></div><p class="footer-copy">© ۱۴۰۵ پاساژگردی</p></div></footer>';
        }
      }
    }
    Promise.all([
      loadComponent('header.html', 'header-placeholder'),
      loadComponent('footer.html', 'footer-placeholder')
    ]).then(function () {
      var s = document.createElement('script');
      s.src = 'app.js';
      s.defer = true;
      document.body.appendChild(s);
    });
  </script>
</body>
</html>
