
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="دستیار هوش مصنوعی تی تی موبایل">
<title>دستیار هوشمند تی تی موبایل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  color-scheme:light;
  --bg:#fff; --surface:#fff; --soft:#f5f5f7; --text:#202124;
  --muted:#7a7a84; --line:#e6e6eb; --accent:#25252b; --on-accent:#fff;
  --link:#2563eb; --danger:#c2410c; --ring:rgba(37,99,235,.35);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111114; --surface:#19191e; --soft:#24242b; --text:#f2f2f4;
  --muted:#a0a0aa; --line:#303038; --accent:#f2f2f4; --on-accent:#111114;
  --link:#60a5fa; --danger:#fb923c; --ring:rgba(96,165,250,.4);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;-webkit-text-size-adjust:100%}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{height:100%;height:100dvh;max-width:820px;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{flex:none;height:58px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
.brand-mark{width:30px;height:30px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:15px}
.actions{display:flex;gap:6px}
.icon-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:grid;place-items:center;font-size:18px;transition:background .15s}
.icon-btn:hover{background:var(--soft)}
main{flex:1;min-height:0;overflow-y:auto;padding:24px 16px 8px;display:flex;flex-direction:column;scroll-behavior:smooth}
.welcome{margin:auto 0;text-align:center;padding:24px 0 40px}
.welcome[hidden]{display:none}
.welcome-mark{width:48px;height:48px;margin:0 auto 16px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:22px}
h1{font-size:clamp(20px,4.5vw,28px);line-height:1.7;margin:0 0 6px;font-weight:700}
.welcome p{font-size:13px;color:var(--muted);line-height:2;margin:0}
.suggestions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:22px}
.suggestion{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:12px;transition:background .15s}
.suggestion:hover{background:var(--soft)}
.chat{display:flex;flex-direction:column;gap:20px;padding-bottom:12px}
.message{max-width:88%;display:flex;flex-direction:column;gap:4px;animation:appear .18s ease}
.message.user{align-self:flex-start}
.message.ai{align-self:stretch;max-width:100%}
.message-label{font-size:10px;color:var(--muted);padding:0 4px}
.message-body{font-size:13.5px;line-height:2;white-space:pre-wrap;overflow-wrap:anywhere;unicode-bidi:plaintext}
.user .message-body{background:var(--soft);padding:9px 14px;border-radius:16px 5px 16px 16px}
.ai .message-body{padding:2px 4px}
.message-body a{display:inline-flex;align-items:center;gap:6px;margin:4px 0;padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--link);font-size:12px;font-weight:600;text-decoration:none;unicode-bidi:isolate;transition:background .15s}
.message-body a:hover{background:var(--soft)}
.typing{display:flex;gap:5px;padding:8px 4px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:pulse .7s infinite alternate}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
.msg-error{align-self:flex-start;display:flex;align-items:center;gap:8px;padding:0 4px;font-size:11px;color:var(--danger);animation:appear .18s ease}
.msg-error .err-ico{font-size:14px}
.msg-error .err-detail{color:var(--muted)}
.retry-btn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:3px 10px 3px 8px;font-size:11px;font-weight:500;transition:background .15s}
.retry-btn:hover{background:var(--soft)}
.retry-btn svg{font-size:13px}
.retry-btn:disabled{opacity:.5;cursor:default}
.composer-wrap{flex:none;padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.composer{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line);border-radius:20px;background:var(--surface);padding:8px;transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:var(--link);box-shadow:0 0 0 3px var(--ring)}
.send-btn{width:40px;height:40px;flex:none;border:0;border-radius:13px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:19px;transition:opacity .15s,transform .1s}
.send-btn:active{transform:scale(.94)}
.send-btn:disabled{opacity:.3;cursor:not-allowed}
#prompt{flex:1;min-width:0;min-height:40px;max-height:150px;resize:none;border:0;outline:0;background:transparent;font-size:14px;line-height:1.9;padding:6px 4px;direction:rtl}
#prompt::placeholder{color:var(--muted)}
.hint{text-align:center;color:var(--muted);font-size:10px;padding-top:6px}
@keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes pulse{to{opacity:.3;transform:translateY(-3px)}}
@media(max-width:600px){
  header{height:54px;padding:0 12px}
  .brand{font-size:12.5px}
  main{padding:18px 12px 6px}
  .composer-wrap{padding-inline:12px}
  .message{max-width:94%}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>

<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span>دستیار تی تی موبایل</span>
    </div>
    <div class="actions">
      <button class="icon-btn" id="newChat" title="گفت‌وگوی جدید" aria-label="گفت‌وگوی جدید">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" title="تغییر حالت شب و روز" aria-label="تغییر حالت شب و روز"></button>
    </div>
  </header>

  <main id="scroller">
    <section class="welcome" id="welcome">
      <div class="welcome-mark" aria-hidden="true">✦</div>
      <h1>به دستیار هوشمند تی تی موبایل خوش آمدید</h1>
      <p>نام محصول یا یک دسته را بنویسید، یا از گزینه‌های زیر شروع کنید.</p>
      <div class="suggestions">
        <button class="suggestion">اسپیکر</button>
        <button class="suggestion">ساعت هوشمند</button>
        <button class="suggestion">هندزفری</button>
        <button class="suggestion">هدفون</button>
        <button class="suggestion">میکروفن</button>
        <button class="suggestion">جانبی موبایل</button>
        <button class="suggestion">جانبی کامپیوتر</button>
        <button class="suggestion">جعبه باز</button>
      </div>
    </section>
    <section class="chat" id="chat" aria-live="polite"></section>
  </main>

  <div class="composer-wrap">
    <div class="composer">
      <button class="send-btn" id="sendBtn" title="ارسال پیام" aria-label="ارسال پیام" disabled>
        <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
      <textarea id="prompt" rows="1" maxlength="2000" placeholder="پیامت رو بنویس..." aria-label="متن پیام"></textarea>
    </div>
    <div class="hint">Enter برای ارسال، Shift+Enter برای خط جدید</div>
  </div>
</div>

<script>
// آدرس نهایی Production Webhook
const WEBHOOK_URL = "https://titimobilen8n.app.n8n.cloud/webhook-test/woo-chat-assistant";
const REQUEST_TIMEOUT_MS = 120000;

const $ = id => document.getElementById(id);
const promptBox = $("prompt"), sendBtn = $("sendBtn"), chat = $("chat"),
      welcome = $("welcome"), themeBtn = $("themeBtn"), scroller = $("scroller");

const ICONS = {
  moon: '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l-1.4 1.4M17.7 6.3l1.4-1.4"/></svg>',
  warn: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>',
  retry: '<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>'
};

let loading = false;
let lastMessage = "";

const newId = () => (window.crypto && crypto.randomUUID)
  ? crypto.randomUUID()
  : Date.now().toString(36) + Math.random().toString(36).slice(2);

let sessionId = newId();

/* تنظیم تم */
function setTheme(theme, save) {
  document.documentElement.dataset.theme = theme;
  if (save) {
    try { localStorage.setItem("chat-theme", theme); } catch {}
  }
  themeBtn.innerHTML = theme === "dark" ? ICONS.sun : ICONS.moon;
  document.querySelector('meta[name="theme-color"]').content =
    theme === "dark" ? "#111114" : "#ffffff";
}

let saved = null;
try { saved = localStorage.getItem("chat-theme"); } catch {}

setTheme(
  saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"),
  false
);

themeBtn.addEventListener("click", () => {
  setTheme(
    document.documentElement.dataset.theme === "dark" ? "light" : "dark",
    true
  );
});

/* گفت‌وگوی جدید */
$("newChat").addEventListener("click", () => {
  if (loading) return;
  sessionId = newId();
  lastMessage = "";
  chat.replaceChildren();
  welcome.hidden = false;
  resetInput();
  promptBox.focus();
});

/* شناسایی لینک‌ها */
const LINK_RE = /(?:لینک(?:\s*محصول)?\s*[:：]\s*)?(?:\[[^\]]*\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<>"'،؛]+))/g;

function safeUrl(raw) {
  const url = raw.replace(/[.,!?؟،؛:)\]}»]+$/u, "");
  try {
    const u = new URL(url);
    return (u.protocol === "http:" || u.protocol === "https:")
      ? { href: u.href, rest: raw.slice(url.length) }
      : null;
  } catch {
    return null;
  }
}

function renderText(el, text) {
  el.textContent = "";
  text = String(text).replace(/\*\*/g, "");

  let last = 0, m;
  LINK_RE.lastIndex = 0;

  while ((m = LINK_RE.exec(text)) !== null) {
    const p = safeUrl(m[1] || m[2]);
    if (!p) continue;

    if (m.index > last) {
      el.appendChild(document.createTextNode(text.slice(last, m.index)));
    }

    const a = document.createElement("a");
    a.href = p.href;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = "مشاهده محصول";
    el.appendChild(a);

    if (p.rest) {
      el.appendChild(document.createTextNode(p.rest));
    }

    last = m.index + m[0].length;
  }

  if (last < text.length) {
    el.appendChild(document.createTextNode(text.slice(last)));
  }
}

function scrollDown() {
  requestAnimationFrame(() => {
    scroller.scrollTo({ top: scroller.scrollHeight });
  });
}

function addMessage(type, text) {
  const wrap = document.createElement("div");
  wrap.className = "message " + type;

  const label = document.createElement("div");
  label.className = "message-label";
  label.textContent = type === "user" ? "شما" : "دستیار تی تی موبایل";

  const body = document.createElement("div");
  body.className = "message-body";

  if (type === "ai") {
    renderText(body, text);
  } else {
    body.textContent = text;
  }

  wrap.append(label, body);
  chat.appendChild(wrap);
  scrollDown();
}

function addTyping() {
  const wrap = document.createElement("div");
  wrap.className = "message ai";
  wrap.id = "typing";

  wrap.innerHTML =
    '<div class="message-label">در حال نوشتن پاسخ...</div>' +
    '<div class="typing"><span></span><span></span><span></span></div>';

  chat.appendChild(wrap);
  scrollDown();
}

const removeTyping = () => $("typing")?.remove();

/* نمایش خطا و تلاش مجدد */
function addError(shortText) {
  document.querySelector(".msg-error")?.remove();

  const row = document.createElement("div");
  row.className = "msg-error";
  row.setAttribute("role", "alert");

  row.innerHTML =
    '<span class="err-ico">' + ICONS.warn + '</span>' +
    '<span>ارسال نشد</span>' +
    '<span class="err-detail"></span>' +
    '<button type="button" class="retry-btn" aria-label="تلاش مجدد">' +
    ICONS.retry + '<span>تلاش مجدد</span></button>';

  row.querySelector(".err-detail").textContent =
    shortText ? "· " + shortText : "";

  row.querySelector(".retry-btn").addEventListener("click", () => {
    if (loading) return;
    row.remove();
    requestReply(lastMessage);
  });

  chat.appendChild(row);
  scrollDown();
}

function friendlyError(err) {
  if (err.name === "AbortError") return "پاسخ دیر رسید";
  if (err.status) return "خطای سرور " + err.status;
  if (err instanceof TypeError) return "اتصال برقرار نشد";
  return err.message || "";
}

/* مدیریت وضعیت ارسال */
function setLoading(v) {
  loading = v;
  sendBtn.disabled = v || !promptBox.value.trim();
}

/* ارتباط با n8n */
async function requestReply(message) {
  setLoading(true);
  addTyping();

  const controller = new AbortController();
  const timer = setTimeout(
    () => controller.abort(),
    REQUEST_TIMEOUT_MS
  );

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message,
        sessionId: sessionId
      }),
      signal: controller.signal
    });

    const raw = await res.text();

    let data;
    try {
      data = raw ? JSON.parse(raw) : {};
    } catch {
      data = raw;
    }

    if (!res.ok) {
      const e = new Error("http");
      e.status = res.status;
      throw e;
    }

    const answer = typeof data === "string"
      ? data
      : (
          data.reply ??
          data.output ??
          data.text ??
          data.response ??
          data.message ??
          data[0]?.output
        );

    if (answer == null || String(answer).trim() === "") {
      throw new Error("پاسخ خالی بود");
    }

    removeTyping();
    addMessage("ai", String(answer));

  } catch (err) {
    removeTyping();
    addError(friendlyError(err));

  } finally {
    clearTimeout(timer);
    setLoading(false);
    promptBox.focus({ preventScroll: true });
  }
}

/* ارسال پیام */
function sendMessage() {
  const message = promptBox.value.trim();

  if (!message || loading) return;

  lastMessage = message;
  welcome.hidden = true;

  addMessage("user", message);
  resetInput();

  requestReply(message);
}

/* مدیریت ورودی */
function resetInput() {
  promptBox.value = "";
  promptBox.style.height = "";
  sendBtn.disabled = true;
}

sendBtn.addEventListener("click", sendMessage);

promptBox.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    sendMessage();
  }
});

promptBox.addEventListener("input", () => {
  promptBox.style.height = "auto";
  promptBox.style.height =
    Math.min(promptBox.scrollHeight, 150) + "px";

  sendBtn.disabled = loading || !promptBox.value.trim();
});

/* دکمه‌های دسته‌بندی */
document.querySelectorAll(".suggestion").forEach(button => {
  button.addEventListener("click", () => {
    if (loading) return;

    promptBox.value = button.textContent.trim();
    sendMessage();
  });
});
</script>
</body>
</html>
